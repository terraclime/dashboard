AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Terraclime billing microservice deployed as a dedicated Lambda.
Parameters:
  StageName:
    Type: String
    Default: prod
  UseDemoData:
    Type: String
    Default: 'false'
    AllowedValues:
    - 'true'
    - 'false'
  AwsRegion:
    Type: String
    Default: ap-south-1
  UsersTable:
    Type: String
    Default: UserCredentials
  FlowTable:
    Type: String
    Default: flow_data
  DeviceTable:
    Type: String
    Default: device_data
  ApartmentTable:
    Type: String
    Default: apartment_data
  BillingTable:
    Type: String
    Default: tariff_configs
  LeaksTable:
    Type: String
    Default: leak_data
  FinalizationsTable:
    Type: String
    Default: billing_finalizations
  ApartmentTimeZone:
    Type: String
    Default: Asia/Kolkata
  CustomDomainName:
    Type: String
    Default: billing-api.terraclime.com
    Description: Custom domain name for the billing API.
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN for CustomDomainName.
Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 15
    MemorySize: 256
    Architectures:
    - x86_64
    Environment:
      Variables:
        NODE_ENV: production
        USE_DEMO_DATA:
          Ref: UseDemoData
        USERS_TABLE:
          Ref: UsersTable
        FLOW_TABLE:
          Ref: FlowTable
        DEVICE_TABLE:
          Ref: DeviceTable
        APARTMENT_TABLE:
          Ref: ApartmentTable
        BILLING_TABLE:
          Ref: BillingTable
        LEAKS_TABLE:
          Ref: LeaksTable
        FINALIZATIONS_TABLE:
          Ref: FinalizationsTable
        APARTMENT_TIME_ZONE:
          Ref: ApartmentTimeZone
Resources:
  BillingApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName:
        Ref: StageName
      Domain:
        DomainName:
          Ref: CustomDomainName
        CertificateArn:
          Ref: CertificateArn
        EndpointConfiguration: REGIONAL
        SecurityPolicy: TLS_1_2
  BillingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: s3://terraclime-data-live-artifacts-717279694116-ap-south-1/terraclime-billing-api/a2e6d9f9e29a891d0de216807835e6d7
      Handler: billing-api/src/index.handler
      Policies:
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - dynamodb:BatchGetItem
          - dynamodb:GetItem
          - dynamodb:Query
          - dynamodb:Scan
          Resource:
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTable}
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTable}/index/*
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${FlowTable}
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${FlowTable}/index/*
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DeviceTable}
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DeviceTable}/index/*
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ApartmentTable}
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ApartmentTable}/index/*
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BillingTable}
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BillingTable}/index/*
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LeaksTable}
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LeaksTable}/index/*
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${FinalizationsTable}
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${FinalizationsTable}/index/*
      Events:
        RootRoute:
          Type: Api
          Properties:
            RestApiId:
              Ref: BillingApiGateway
            Path: /
            Method: ANY
        ProxyRoute:
          Type: Api
          Properties:
            RestApiId:
              Ref: BillingApiGateway
            Path: /{proxy+}
            Method: ANY
    Metadata:
      SamResourceId: BillingFunction
Outputs:
  BillingBaseUrl:
    Description: Base URL for the deployed billing API stage.
    Value:
      Fn::Sub: https://${BillingApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  BillingSummaryEndpoint:
    Description: GET endpoint for billing summary.
    Value:
      Fn::Sub: https://${BillingApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/api/billing/summary
  BillingCustomBaseUrl:
    Description: Custom HTTPS base URL for the deployed billing API.
    Value:
      Fn::Sub: https://${CustomDomainName}
  BillingCustomSummaryEndpoint:
    Description: Custom HTTPS GET endpoint for billing summary.
    Value:
      Fn::Sub: https://${CustomDomainName}/api/billing/summary
